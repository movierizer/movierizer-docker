services:
  db:
    image: postgres:16
    container_name: movierizer_db
    restart: always
    env_file:
      - .env
      - private.env
    ports:
      - "5432:5432"
    networks:
      - backend

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"
    networks:
      - backend
  
  back:
    build: '../../movierizer-api'
    image: movierizer_api
    container_name: movierizer_api
    restart: always
    env_file:
      - .env
      - private.env
    ports:
      - "8081:5000"
    networks:
      - backend
      - frontend
    depends_on:
      - db
      
  front:
    build: '../../movierizer-front'
    image: movierizer_front
    container_name: movierizer_front
    restart: always
    env_file:
      - .env
    ports:
      - "8080:3000"
    networks:
      - frontend
    depends_on:
      - back

networks:
  backend:
    name: backend
    driver: bridge
  frontend:
    name: frontend
    driver: bridge