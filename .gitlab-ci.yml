stages:
  - deploy

deploy:
  stage: deploy
  image: debian:bullseye
  before_script:
    - apt-get update && apt-get install -y rsync openssh-client
    - mkdir -p ~/.ssh
    - PRIVATE_KEY_DECODED="$(cat $DEPLOY_PRIVATE_KEY | base64 -d)"
    - echo "$PRIVATE_KEY_DECODED" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H 217.182.104.218 >> ~/.ssh/known_hosts
  script:
    - |
      cat <<EOF > ./src/.private.env
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      POSTGRES_USER=$POSTGRES_USER
      BEARER_TOKEN_TDMB=$TMDB_TOKEN
      EOF
    - rsync -avz --delete ./ movierizer@217.182.104.218:/home/movierizer/movierizer
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no movierizer@217.182.104.218 "cd /home/movierizer/movierizer/src/docker-compose && docker-compose up -d"    
    