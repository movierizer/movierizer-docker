stages:
  - deploy
  - undeploy

before_script:
  - apt-get update && apt-get install -y rsync openssh-client
  - mkdir -p ~/.ssh
  - PRIVATE_KEY_DECODED="$(cat $PROD_DEPLOY_PRIVATE_KEY | base64 -d)"
  - echo "$PRIVATE_KEY_DECODED" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - ssh-keyscan -H $PROD_IP_VM >> ~/.ssh/known_hosts

deploy:
  stage: deploy
  image: debian:bullseye
  script:
    - |
      cat <<EOF > ./src/.private.env
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      POSTGRES_USER=$POSTGRES_USER
      BEARER_TOKEN_TDMB=$TMDB_TOKEN
      EOF
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no movierizer@141.94.104.171 "mkdir -p /home/movierizer/movierizer"
    - rsync -avz --delete ./ movierizer@$PROD_IP_VM:/home/movierizer/movierizer
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no movierizer@$PROD_IP_VM "cd /home/movierizer/movierizer/src && docker compose up -d"    
    
undeploy:
  stage: undeploy
  image: debian:bullseye
  when: manual
  script:
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no movierizer@$PROD_IP_VM "cd /home/movierizer/movierizer/src && docker compose down"
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no movierizer@$PROD_IP_VM "rm -rf /home/movierizer/movierizer && mkdir /home/movierizer/movierizer"
